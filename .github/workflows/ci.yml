name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Convex Codegen
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npm run convex:codegen

      - name: Convex Codegen (Skipped)
        if: ${{ secrets.CONVEX_DEPLOY_KEY == '' }}
        run: echo "Skipping Convex codegen because CONVEX_DEPLOY_KEY is not configured."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
